[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-monitor"
version = "0.1.0"
description = "Live throughput monitor and tuning advisor for vLLM servers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Haritz Puerto", email = "haritz.puerto@tue.ellis.eu" }]
keywords = ["vllm", "llm", "inference", "monitoring", "throughput", "gpu"]
dependencies = [
    "rich>=13",
    "prometheus-client>=0.17",
]

[project.optional-dependencies]
hf = ["huggingface-hub>=0.20"]
dev = ["pytest>=7"]

[project.scripts]
vllm-monitor = "vllm_monitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
